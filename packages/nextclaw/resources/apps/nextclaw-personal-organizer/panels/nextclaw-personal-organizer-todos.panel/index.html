<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>待办</title>
  <style>
    :root{color-scheme:light dark;--bg:#f4f1ea;--card:#fffdf8;--ink:#26302c;--muted:#78817d;--line:#dedbd2;--accent:#5c6f62;--accent2:#dfe7dd;--danger:#a64c45;--shadow:0 18px 50px #28322d12;font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#dfe8dc 0,transparent 30%),var(--bg);color:var(--ink);min-height:100vh}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.shell{max-width:860px;margin:auto;padding:30px 28px 80px}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}.header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:5px 0 24px}h1{font-family:Georgia,"Songti SC",serif;font-size:36px;line-height:1.1;margin:0;font-weight:600}.summary{color:var(--muted);margin-top:7px}.icon-btn,.ghost,.primary,.danger{border:0;border-radius:12px;padding:9px 13px;background:transparent}.icon-btn:hover,.ghost:hover{background:#0000000a}.primary{background:var(--ink);color:var(--card);font-weight:700}.danger{color:var(--danger)}.danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent)}.composer{display:grid;grid-template-columns:1fr auto;gap:10px;background:var(--card);padding:10px;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.composer input{border:0;background:transparent;padding:6px 10px;outline:none;font-size:16px}.tabs{display:flex;gap:4px;margin:22px 0 12px}.tab{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:999px}.tab[aria-selected=true]{background:var(--accent2);color:var(--ink);font-weight:700}.list{display:grid;gap:9px}.item{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:start;background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--line);border-radius:16px;padding:14px 14px 13px;transition:.18s ease}.item:hover{transform:translateY(-1px);box-shadow:0 10px 30px #28322d0d}.check{appearance:none;width:21px;height:21px;border:1.5px solid #8b948f;border-radius:7px;margin:2px 0 0;display:grid;place-items:center}.check:checked{background:var(--accent);border-color:var(--accent)}.check:checked:after{content:"✓";color:white;font-size:14px;font-weight:800}.title{font-weight:700;font-size:15px;overflow-wrap:anywhere}.completed .title{text-decoration:line-through;color:var(--muted)}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:4px}.pill{border-radius:999px;padding:2px 7px;background:#eeeae0}.high{background:#f2dcd8;color:#8d433d}.low{background:#dfe8ed;color:#4d6875}.actions{display:flex}.empty{text-align:center;padding:70px 20px;color:var(--muted)}.empty b{display:block;color:var(--ink);font-family:Georgia,"Songti SC",serif;font-size:22px;margin-bottom:7px}.loading{padding:50px;text-align:center;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);padding:0;width:min(520px,calc(100% - 28px));box-shadow:0 30px 100px #0003}dialog::backdrop{background:#18201d70;backdrop-filter:blur(4px)}form{padding:22px}.form-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.form-head h2{font-family:Georgia,"Songti SC",serif;margin:0;font-size:24px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;background:transparent;padding:10px 11px;outline:none}.field textarea{min-height:100px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-actions{display:flex;justify-content:space-between;gap:8px;margin-top:20px}.form-actions-end{display:flex;gap:8px}.toast{position:fixed;right:20px;bottom:20px;max-width:340px;background:var(--ink);color:var(--card);border-radius:12px;padding:11px 14px;box-shadow:var(--shadow)}.error{background:#f6e0dc;color:#833b35}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:560px){.shell{padding:22px 16px 70px}h1{font-size:31px}.header{align-items:start}.grid{grid-template-columns:1fr}.item{grid-template-columns:auto 1fr}.actions{grid-column:2}.composer{grid-template-columns:1fr}.composer button{width:100%}}@media(prefers-color-scheme:dark){:root{--bg:#1e2421;--card:#282f2b;--ink:#edf0eb;--muted:#a5ada8;--line:#3d4641;--accent:#8da692;--accent2:#37463c;--danger:#e58b82;--shadow:0 18px 50px #0003}.pill{background:#343b37}.high{background:#5b3431;color:#ffd5d0}.low{background:#30454f;color:#d2effc}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">Personal space</div>
    <header class="header"><div><h1>待办</h1><div class="summary" id="summary">把下一步放在眼前。</div></div><button class="ghost" id="detailAdd">＋ 详细待办</button></header>
    <form class="composer" id="quickForm"><label class="sr" for="quickTitle">新增待办</label><input id="quickTitle" autocomplete="off" placeholder="接下来要做什么？"><button class="primary" type="submit">添加</button></form>
    <nav class="tabs" aria-label="待办筛选"><button class="tab" data-filter="open" aria-selected="true">未完成</button><button class="tab" data-filter="all">全部</button><button class="tab" data-filter="completed">已完成</button></nav>
    <section class="list" id="list" aria-live="polite"><div class="loading">正在整理待办…</div></section>
  </main>
  <dialog id="editor"><form method="dialog" id="editForm"><div class="form-head"><h2 id="formTitle">新待办</h2><button class="icon-btn" value="cancel" aria-label="关闭">✕</button></div><input type="hidden" id="editId"><div class="field"><label for="editTitle">标题</label><input id="editTitle" required maxlength="180"></div><div class="grid"><div class="field"><label for="editDue">截止时间</label><input id="editDue" type="datetime-local"></div><div class="field"><label for="editPriority">优先级</label><select id="editPriority"><option value="normal">普通</option><option value="high">高</option><option value="low">低</option></select></div></div><div class="field"><label for="editNotes">备注</label><textarea id="editNotes" placeholder="补充必要的上下文，不必写成项目文档。"></textarea></div><div class="form-actions"><button class="danger" id="deleteTodo" type="button" hidden>删除待办</button><div class="form-actions-end"><button class="ghost" value="cancel">取消</button><button class="primary" id="save" value="default">保存</button></div></div></form></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
    const service='nextclaw-personal-organizer-data.';let items=[],filter='open';
    const $=id=>document.getElementById(id);const list=$('list'),editor=$('editor'),toast=$('toast');
    async function invoke(action,input={}){if(!window.nextclaw?.serviceActions)throw new Error('NextClaw 服务桥接不可用');return await window.nextclaw.serviceActions.invoke(service+action,input)}
    function notify(message,error=false){toast.textContent=message;toast.classList.toggle('error',error);toast.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.hidden=true,3000)}
    function esc(value=''){return String(value).replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]))}
    function formatDate(value){if(!value)return '';const date=new Date(value);return Number.isFinite(date.getTime())?new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(date):value}
    async function load(){list.innerHTML='<div class="loading">正在整理待办…</div>';try{items=(await invoke('todo_list',{status:'all'})).items||[];render()}catch(error){list.innerHTML='<div class="empty"><b>还不能读取待办</b><span>请完成权限授权，或从 Apps 中重新启用个人空间。</span></div>';notify(error.message||String(error),true)}}
    function render(){const visible=items.filter(item=>filter==='all'||(filter==='completed')===!!item.completed);const open=items.filter(item=>!item.completed).length;$('summary').textContent=open?`${open} 件事仍在等待你。`:'眼前暂时没有未完成的事。';if(!visible.length){list.innerHTML=`<div class="empty"><b>${filter==='completed'?'还没有完成记录':'这里很清爽'}</b><span>${filter==='open'?'记下一件真正要做的事。':'换个筛选看看。'}</span></div>`;return}list.innerHTML=visible.map(item=>`<article class="item ${item.completed?'completed':''}" data-id="${item.id}"><input class="check" type="checkbox" ${item.completed?'checked':''} aria-label="${item.completed?'标记为未完成':'完成'}：${esc(item.title)}"><div><div class="title">${esc(item.title)}</div><div class="meta">${item.dueDate?`<span>${formatDate(item.dueDate)}</span>`:''}${item.priority&&item.priority!=='normal'?`<span class="pill ${item.priority}">${item.priority==='high'?'高优先级':'低优先级'}</span>`:''}${item.notes?`<span title="${esc(item.notes)}">有备注</span>`:''}</div></div><div class="actions"><button class="icon-btn edit" aria-label="编辑">•••</button></div></article>`).join('')}
    async function create(title,extra={}){const payload=await invoke('todo_create',{title,...extra});items.unshift(payload.item);render();notify('待办已添加')}
    $('quickForm').addEventListener('submit',async event=>{event.preventDefault();const input=$('quickTitle'),title=input.value.trim();if(!title)return;input.disabled=true;try{await create(title);input.value=''}catch(error){notify(error.message||String(error),true)}finally{input.disabled=false;input.focus()}})
    document.querySelector('.tabs').addEventListener('click',event=>{const button=event.target.closest('[data-filter]');if(!button)return;filter=button.dataset.filter;document.querySelectorAll('.tab').forEach(tab=>tab.setAttribute('aria-selected',String(tab===button)));render()})
    list.addEventListener('change',async event=>{if(!event.target.matches('.check'))return;const id=event.target.closest('.item').dataset.id;try{const payload=await invoke('todo_update',{id,completed:event.target.checked});items=items.map(item=>item.id===id?payload.item:item);render()}catch(error){event.target.checked=!event.target.checked;notify(error.message||String(error),true)}})
    list.addEventListener('click',event=>{const button=event.target.closest('.edit');if(!button)return;openEditor(items.find(item=>item.id===button.closest('.item').dataset.id))})
    function localDate(value){if(!value)return '';const d=new Date(value),pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
    function openEditor(item){$('formTitle').textContent=item?'编辑待办':'新待办';$('editId').value=item?.id||'';$('editTitle').value=item?.title||'';$('editDue').value=localDate(item?.dueDate);$('editPriority').value=item?.priority||'normal';$('editNotes').value=item?.notes||'';$('deleteTodo').hidden=!item;editor.showModal();setTimeout(()=>$('editTitle').focus(),20)}
    $('detailAdd').addEventListener('click',()=>openEditor());
    $('deleteTodo').addEventListener('click',async()=>{const id=$('editId').value,item=items.find(entry=>entry.id===id);if(!id||!item||!confirm(`删除“${item.title}”？`))return;try{await invoke('todo_delete',{id});items=items.filter(entry=>entry.id!==id);editor.close();render();notify('待办已删除')}catch(error){notify(error.message||String(error),true)}})
    $('editForm').addEventListener('submit',async event=>{if(event.submitter?.value==='cancel')return;event.preventDefault();const id=$('editId').value,input={title:$('editTitle').value.trim(),dueDate:$('editDue').value?new Date($('editDue').value).toISOString():'',priority:$('editPriority').value,notes:$('editNotes').value.trim()};if(!input.title)return;try{if(id){const payload=await invoke('todo_update',{id,...input});items=items.map(item=>item.id===id?payload.item:item)}else await create(input.title,input);editor.close();render();notify('已保存')}catch(error){notify(error.message||String(error),true)}})
    load();
  </script>
</body>
</html>
