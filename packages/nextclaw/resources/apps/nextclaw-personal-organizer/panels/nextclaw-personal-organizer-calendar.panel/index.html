<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日历</title>
  <style>
    :root{color-scheme:light dark;--bg:#eef1ef;--card:#fbfcfa;--ink:#28312e;--muted:#7c8581;--line:#d9dfdc;--accent:#3d7e79;--soft:#dcebe7;--today:#e6a55e;--danger:#a54640;font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#dcebe7,transparent 35%),var(--bg);color:var(--ink)}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.shell{max-width:1100px;margin:auto;padding:28px 24px 70px}.header{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:20px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:700}h1{font:600 35px/1.1 Georgia,"Songti SC",serif;margin:5px 0}.subtitle{color:var(--muted)}.header-actions,.month-nav{display:flex;gap:7px;align-items:center}.primary,.ghost,.icon{border:0;border-radius:11px;padding:9px 12px}.primary{background:var(--ink);color:var(--card);font-weight:700}.ghost,.icon{background:transparent}.ghost:hover,.icon:hover{background:#0000000a}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:14px}.calendar,.agenda{border:1px solid var(--line);background:color-mix(in srgb,var(--card) 96%,transparent);border-radius:18px;box-shadow:0 18px 50px #26332e0c;overflow:hidden}.month-bar{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line)}.month-title{font:600 20px Georgia,"Songti SC",serif}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays div{padding:9px;text-align:center;color:var(--muted);font-size:11px;font-weight:700;border-bottom:1px solid var(--line)}.day{min-height:95px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;overflow:hidden}.day:nth-child(7n){border-right:0}.day.other{color:#a7ada9;background:#000000025}.date{width:25px;height:25px;display:grid;place-items:center;border-radius:50%;font-size:12px}.today .date{background:var(--today);color:white;font-weight:800}.event{display:block;width:100%;border:0;text-align:left;background:var(--soft);color:#275f5a;border-radius:6px;padding:3px 5px;margin-top:4px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event.ics{background:#e8e2f2;color:#62527f}.agenda{padding:17px;align-self:start}.agenda h2{font:600 20px Georgia,"Songti SC",serif;margin:0}.agenda-sub{color:var(--muted);font-size:12px;margin:4px 0 14px}.agenda-list{display:grid;gap:8px}.agenda-item{border-left:3px solid var(--accent);padding:7px 8px;background:var(--bg);border-radius:0 9px 9px 0}.agenda-item.ics{border-color:#806ba2}.agenda-item b{display:block}.agenda-item small{color:var(--muted)}.connections{border-top:1px solid var(--line);margin-top:18px;padding-top:15px}.connections-head{display:flex;justify-content:space-between;align-items:center}.connections h3{font-size:13px;margin:0}.source{display:grid;grid-template-columns:1fr auto;gap:4px;margin-top:9px}.source small{color:var(--muted)}.source-error{color:var(--danger)!important}.empty{color:var(--muted);padding:15px 0}dialog{border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);padding:0;width:min(520px,calc(100% - 28px));box-shadow:0 30px 100px #0003}dialog::backdrop{background:#14231f66;backdrop-filter:blur(4px)}form{padding:22px}.form-head{display:flex;justify-content:space-between;align-items:center}.form-head h2{font:600 24px Georgia,"Songti SC",serif;margin:0}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field textarea{border:1px solid var(--line);border-radius:11px;background:transparent;padding:10px 11px;outline:none}.field textarea{min-height:75px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.check{display:flex;align-items:center;gap:7px}.form-actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.right{display:flex;gap:8px}.danger{color:var(--danger)}.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:var(--card);padding:10px 13px;border-radius:11px}.error{background:var(--danger)}@media(max-width:820px){.layout{grid-template-columns:1fr}.agenda{order:-1}.day{min-height:76px}.header{align-items:start}.header-actions{flex-wrap:wrap;justify-content:flex-end}}@media(max-width:560px){.shell{padding:20px 10px 60px}h1{font-size:30px}.subtitle{display:none}.header{padding:0 6px}.header-actions .ghost{font-size:0}.header-actions .ghost:after{content:'连接';font-size:14px}.day{min-height:60px;padding:4px}.event{font-size:0;height:7px;padding:0;border-radius:4px}.weekdays div{padding:6px 2px}.grid{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{--bg:#202624;--card:#29312e;--ink:#eef2ef;--muted:#a2aca7;--line:#3e4944;--soft:#304c46;--accent:#7fc2b8}.event{color:#c5f5ed}.event.ics{background:#443c55;color:#e6dcfb}.ghost:hover,.icon:hover{background:#ffffff0a}}
  </style>
</head>
<body>
  <main class="shell"><header class="header"><div><div class="eyebrow">Personal space</div><h1>日历</h1><div class="subtitle">自己的安排，和已有日历放在一起看。</div></div><div class="header-actions"><button class="ghost" id="connect">连接已有日历</button><button class="primary" id="add">＋ 新日程</button></div></header><div class="layout"><section class="calendar"><div class="month-bar"><button class="icon" id="prev" aria-label="上个月">←</button><div class="month-title" id="monthTitle"></div><div class="month-nav"><button class="ghost" id="today">今天</button><button class="icon" id="next" aria-label="下个月">→</button></div></div><div class="weekdays"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div><div class="days" id="days"></div></section><aside class="agenda"><h2 id="agendaTitle">本月安排</h2><div class="agenda-sub" id="agendaSub"></div><div class="agenda-list" id="agenda"></div><div class="connections"><div class="connections-head"><h3>已连接日历</h3><button class="icon" id="sync" aria-label="同步">↻</button></div><div id="sources"></div></div></aside></div></main>
  <dialog id="eventDialog"><form method="dialog" id="eventForm"><div class="form-head"><h2 id="eventFormTitle">新日程</h2><button class="icon" value="cancel">✕</button></div><input type="hidden" id="eventId"><div class="field"><label for="eventTitle">标题</label><input id="eventTitle" required maxlength="180"></div><div class="grid"><div class="field"><label for="eventStart">开始</label><input id="eventStart" type="datetime-local" required></div><div class="field"><label for="eventEnd">结束</label><input id="eventEnd" type="datetime-local"></div></div><label class="check"><input id="allDay" type="checkbox"> 全天</label><div class="field"><label for="location">地点</label><input id="location"></div><div class="field"><label for="eventNotes">备注</label><textarea id="eventNotes"></textarea></div><div class="form-actions"><button class="ghost danger" id="eventDelete" type="button" hidden>删除</button><div class="right"><button class="ghost" value="cancel">取消</button><button class="primary" value="default">保存</button></div></div></form></dialog>
  <dialog id="connectDialog"><form method="dialog" id="connectForm"><div class="form-head"><h2>连接 ICS 日历</h2><button class="icon" value="cancel">✕</button></div><p class="subtitle">粘贴现有日历提供的私密 ICS 订阅链接。链接只保存在本机。</p><div class="field"><label for="sourceName">名称</label><input id="sourceName" required placeholder="工作日历"></div><div class="field"><label for="sourceUrl">ICS 订阅链接</label><input id="sourceUrl" type="url" required placeholder="https://…/calendar.ics"></div><div class="form-actions"><span></span><div class="right"><button class="ghost" value="cancel">取消</button><button class="primary" value="default">连接并同步</button></div></div></form></dialog><div id="toast" class="toast" role="status" hidden></div>
  <script>
    const service='nextclaw-personal-organizer-data.';let cursor=startMonth(new Date()),items=[],subscriptions=[];const $=id=>document.getElementById(id),toast=$('toast');
    async function invoke(action,input={}){if(!window.nextclaw?.serviceActions)throw new Error('NextClaw 服务桥接不可用');return await window.nextclaw.serviceActions.invoke(service+action,input)}function esc(v=''){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function notify(message,error=false){toast.textContent=message;toast.classList.toggle('error',error);toast.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.hidden=true,3000)}function startMonth(date){return new Date(date.getFullYear(),date.getMonth(),1)}function addMonths(date,n){return new Date(date.getFullYear(),date.getMonth()+n,1)}function dayKey(value){const d=new Date(value),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
    async function load(){const end=addMonths(cursor,1);try{const payload=await invoke('event_list',{start:cursor.toISOString(),end:end.toISOString()});items=payload.items||[];subscriptions=payload.subscriptions||[];render()}catch(error){$('days').innerHTML='<div class="empty" style="grid-column:1/-1">无法读取日历，请检查授权或应用状态。</div>';notify(error.message||String(error),true)}}
    function render(){const locale=navigator.language||'zh-CN';$('monthTitle').textContent=new Intl.DateTimeFormat(locale,{year:'numeric',month:'long'}).format(cursor);const start=new Date(cursor),offset=(start.getDay()+6)%7;start.setDate(start.getDate()-offset);const today=dayKey(new Date());$('days').innerHTML=Array.from({length:42},(_,index)=>{const date=new Date(start);date.setDate(start.getDate()+index);const key=dayKey(date),dayItems=items.filter(item=>dayKey(item.start)===key);return `<div class="day ${date.getMonth()!==cursor.getMonth()?'other':''} ${key===today?'today':''}" data-date="${key}"><span class="date">${date.getDate()}</span>${dayItems.slice(0,3).map(item=>`<button class="event ${item.source==='ics'?'ics':''}" data-id="${esc(item.id)}" title="${esc(item.title)}">${esc(item.title)}</button>`).join('')}</div>`}).join('');const upcoming=items.filter(item=>new Date(item.end||item.start)>=new Date()).slice(0,8);$('agendaSub').textContent=`${items.length} 个日程`;$('agenda').innerHTML=upcoming.length?upcoming.map(item=>`<button class="agenda-item ${item.source==='ics'?'ics':''}" data-id="${esc(item.id)}"><b>${esc(item.title)}</b><small>${formatEventTime(item)}${item.location?' · '+esc(item.location):''}</small></button>`).join(''):'<div class="empty">本月还没有安排。</div>';$('sources').innerHTML=subscriptions.length?subscriptions.map(source=>`<div class="source" data-id="${source.id}"><div><b>${esc(source.name)}</b><br><small class="${source.lastError?'source-error':''}">${source.lastError?esc(source.lastError):source.lastSyncedAt?'已同步 '+new Date(source.lastSyncedAt).toLocaleString():'等待同步'}</small></div><button class="icon unsubscribe" aria-label="断开">×</button></div>`).join(''):'<div class="empty">尚未连接外部日历。</div>'}
    function formatEventTime(item){const d=new Date(item.start);return item.allDay?d.toLocaleDateString():new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)}function localDate(value){if(!value)return '';const d=new Date(value),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
    function openEvent(item,date){if(item?.source==='ics'){notify('外部日历事件请在原日历中修改');return}const start=item?.start||new Date(`${date||dayKey(new Date())}T09:00:00`).toISOString();$('eventFormTitle').textContent=item?'编辑日程':'新日程';$('eventId').value=item?.id||'';$('eventTitle').value=item?.title||'';$('eventStart').value=localDate(start);$('eventEnd').value=localDate(item?.end||new Date(new Date(start).getTime()+3600000));$('allDay').checked=item?.allDay||false;$('location').value=item?.location||'';$('eventNotes').value=item?.notes||'';$('eventDelete').hidden=!item;$('eventDialog').showModal();setTimeout(()=>$('eventTitle').focus(),20)}
    $('add').addEventListener('click',()=>openEvent());$('connect').addEventListener('click',()=>$('connectDialog').showModal());$('prev').addEventListener('click',()=>{cursor=addMonths(cursor,-1);load()});$('next').addEventListener('click',()=>{cursor=addMonths(cursor,1);load()});$('today').addEventListener('click',()=>{cursor=startMonth(new Date());load()});$('days').addEventListener('dblclick',event=>{const day=event.target.closest('.day');if(day)openEvent(null,day.dataset.date)});document.addEventListener('click',event=>{const target=event.target.closest('[data-id]');if(!target||target.classList.contains('source'))return;const item=items.find(entry=>entry.id===target.dataset.id);if(item)openEvent(item)});
    $('eventForm').addEventListener('submit',async event=>{if(event.submitter?.value==='cancel')return;event.preventDefault();const id=$('eventId').value,input={title:$('eventTitle').value.trim(),start:new Date($('eventStart').value).toISOString(),end:$('eventEnd').value?new Date($('eventEnd').value).toISOString():'',allDay:$('allDay').checked,location:$('location').value.trim(),notes:$('eventNotes').value.trim()};try{await invoke(id?'event_update':'event_create',id?{id,...input}:input);$('eventDialog').close();await load();notify('日程已保存')}catch(error){notify(error.message||String(error),true)}});$('eventDelete').addEventListener('click',async()=>{const id=$('eventId').value;if(!id||!confirm('删除这个日程？'))return;try{await invoke('event_delete',{id});$('eventDialog').close();await load();notify('日程已删除')}catch(error){notify(error.message||String(error),true)}});$('connectForm').addEventListener('submit',async event=>{if(event.submitter?.value==='cancel')return;event.preventDefault();try{await invoke('calendar_subscribe',{name:$('sourceName').value.trim(),url:$('sourceUrl').value.trim()});$('connectDialog').close();$('connectForm').reset();await load();notify('日历已连接')}catch(error){notify(error.message||String(error),true)}});$('sync').addEventListener('click',async()=>{try{await invoke('calendar_sync',{});await load();notify('日历已同步')}catch(error){await load();notify(error.message||String(error),true)}});$('sources').addEventListener('click',async event=>{const button=event.target.closest('.unsubscribe');if(!button)return;const source=button.closest('.source');if(!confirm('断开这个日历并移除已同步事件？'))return;try{await invoke('calendar_unsubscribe',{id:source.dataset.id});await load();notify('日历已断开')}catch(error){notify(error.message||String(error),true)}});load();
  </script>
</body>
</html>
