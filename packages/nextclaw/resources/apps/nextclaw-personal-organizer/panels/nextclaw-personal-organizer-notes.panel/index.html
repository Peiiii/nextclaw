<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>笔记</title>
  <style>
    :root{color-scheme:light dark;--bg:#f1eee7;--paper:#fffdf8;--ink:#2d302e;--muted:#81827c;--line:#dedbd2;--accent:#75679b;--soft:#ebe6f4;--danger:#a95049;font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:270px 1fr;height:100vh}.sidebar{border-right:1px solid var(--line);padding:20px 14px;background:color-mix(in srgb,var(--paper) 70%,transparent);display:flex;flex-direction:column;min-width:0}.brand{display:flex;justify-content:space-between;align-items:center;padding:0 6px 14px}.brand h1{font:600 25px/1 Georgia,"Songti SC",serif;margin:0}.new,.save{border:0;border-radius:11px;background:var(--ink);color:var(--paper);font-weight:700;padding:8px 11px}.search{border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:9px 11px;outline:none;width:100%}.notes{overflow:auto;margin-top:12px;display:grid;gap:4px}.note{border:0;background:transparent;text-align:left;padding:10px;border-radius:11px;min-width:0}.note:hover{background:#00000008}.note.active{background:var(--soft)}.note b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note small{color:var(--muted)}.empty{padding:34px 12px;color:var(--muted);text-align:center}.main{min-width:0;display:flex;flex-direction:column;background:var(--paper)}.toolbar{display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);padding:13px 18px}.title{border:0;background:transparent;outline:none;font:600 23px/1.2 Georgia,"Songti SC",serif;min-width:0;flex:1}.mode{display:flex;background:var(--bg);border-radius:10px;padding:3px}.mode button,.icon{border:0;background:transparent;border-radius:8px;padding:6px 9px}.mode button.active{background:var(--paper);box-shadow:0 1px 5px #0001}.icon:hover{background:#0000000a}.dirty{font-size:12px;color:var(--muted)}.workspace{flex:1;min-height:0;display:grid}.editor,.preview{grid-area:1/1;width:100%;height:100%;border:0;outline:0;padding:28px max(28px,8vw);background:transparent;overflow:auto}.editor{resize:none;font:15px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace}.preview{font-size:16px;line-height:1.75}.preview h1,.preview h2,.preview h3{font-family:Georgia,"Songti SC",serif;line-height:1.25;margin:1.4em 0 .5em}.preview h1{font-size:30px}.preview h2{font-size:24px}.preview code{background:var(--bg);padding:2px 5px;border-radius:5px}.preview pre{background:#282b29;color:#eee;padding:15px;border-radius:12px;overflow:auto}.preview blockquote{border-left:3px solid var(--accent);margin-left:0;padding-left:16px;color:var(--muted)}.preview a{color:var(--accent)}.placeholder{margin:auto;text-align:center;color:var(--muted)}.placeholder b{display:block;color:var(--ink);font:600 25px Georgia,"Songti SC",serif;margin-bottom:8px}.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:var(--paper);padding:10px 13px;border-radius:11px}.error{background:#8c3d37}@media(max-width:680px){.app{grid-template-columns:1fr}.sidebar{position:absolute;z-index:3;width:min(85vw,300px);height:100%;transform:translateX(-105%);transition:.2s;box-shadow:10px 0 40px #0002}.sidebar.open{transform:none}.mobile{display:block!important}}.mobile{display:none}@media(prefers-color-scheme:dark){:root{--bg:#202321;--paper:#292d2a;--ink:#eef0eb;--muted:#aaa9a3;--line:#41443f;--soft:#40394e}.note:hover,.icon:hover{background:#ffffff0a}}
  </style>
</head>
<body>
  <div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><h1>笔记</h1><button class="new" id="new">＋ 新建</button></div><input class="search" id="search" placeholder="搜索标题…" aria-label="搜索笔记"><div class="notes" id="notes"><div class="empty">正在读取 Markdown 文件…</div></div></aside><main class="main"><header class="toolbar"><button class="icon mobile" id="menu" aria-label="打开笔记列表">☰</button><input class="title" id="title" placeholder="无标题" disabled><span class="dirty" id="status"></span><div class="mode"><button id="writeMode" class="active">编辑</button><button id="previewMode">预览</button></div><button class="icon" id="delete" aria-label="删除笔记" disabled>⌫</button><button class="save" id="save" disabled>保存</button></header><section class="workspace" id="workspace"><div class="placeholder"><b>写下一点什么</b><span>每篇笔记都是一个真正的 Markdown 文件。</span></div></section></main></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
    const service='nextclaw-personal-organizer-data.';let index=[],current=null,dirty=false,mode='write';const $=id=>document.getElementById(id),notes=$('notes'),workspace=$('workspace'),toast=$('toast');
    async function invoke(action,input={}){if(!window.nextclaw?.serviceActions)throw new Error('NextClaw 服务桥接不可用');return await window.nextclaw.serviceActions.invoke(service+action,input)}
    function esc(value=''){return String(value).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
    function notify(message,error=false){toast.textContent=message;toast.classList.toggle('error',error);toast.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.hidden=true,2800)}
    function setDirty(value){dirty=value;$('status').textContent=value?'未保存':'';document.title=`${value?'• ':''}笔记`}
    async function loadIndex(query=''){try{index=(await invoke('note_list',{query})).items||[];renderIndex()}catch(error){notes.innerHTML='<div class="empty">无法读取笔记。请检查授权或应用状态。</div>';notify(error.message||String(error),true)}}
    function renderIndex(){notes.innerHTML=index.length?index.map(item=>`<button class="note ${current?.id===item.id?'active':''}" data-id="${item.id}"><b>${esc(item.title)}</b><small>${new Date(item.updatedAt).toLocaleDateString()}</small></button>`).join(''):'<div class="empty">还没有笔记。<br>从一个标题开始。</div>'}
    async function select(id){if(dirty&&!confirm('当前修改尚未保存，仍要切换吗？'))return;try{current=(await invoke('note_read',{id})).item;setDirty(false);renderEditor();renderIndex();$('sidebar').classList.remove('open')}catch(error){notify(error.message||String(error),true)}}
    function renderEditor(){if(!current){workspace.innerHTML='<div class="placeholder"><b>写下一点什么</b><span>每篇笔记都是一个真正的 Markdown 文件。</span></div>';$('title').value='';$('title').disabled=true;$('save').disabled=true;$('delete').disabled=true;return}$('title').disabled=false;$('save').disabled=false;$('delete').disabled=false;$('title').value=current.title;workspace.innerHTML=mode==='write'?'<textarea class="editor" id="content" aria-label="Markdown 内容" spellcheck="true"></textarea>':'<article class="preview" id="preview"></article>';if(mode==='write'){$('content').value=current.content||'';$('content').addEventListener('input',()=>{current.content=$('content').value;setDirty(true)})}else $('preview').innerHTML=markdown(current.content||'');$('writeMode').classList.toggle('active',mode==='write');$('previewMode').classList.toggle('active',mode==='preview')}
    function markdown(raw){let text=esc(raw);const blocks=[];text=text.replace(/```([\s\S]*?)```/g,(_,code)=>{blocks.push(`<pre><code>${code.trim()}</code></pre>`);return `\n@@BLOCK${blocks.length-1}@@\n`});text=text.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>').replace(/^[-*] (.+)$/gm,'<li>$1</li>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').split(/\n{2,}/).map(part=>/^<(h\d|blockquote|li|pre)/.test(part)||/^@@BLOCK/.test(part)?part:`<p>${part.replace(/\n/g,'<br>')}</p>`).join('');return text.replace(/@@BLOCK(\d+)@@/g,(_,i)=>blocks[Number(i)]||'')}
    async function save(){if(!current)return;const title=$('title').value.trim();if(!title){notify('请先写一个标题',true);$('title').focus();return}try{const payload=await invoke('note_save',{id:current.id||undefined,title,content:current.content||''});current=payload.item;setDirty(false);await loadIndex($('search').value);notify('Markdown 已保存')}catch(error){notify(error.message||String(error),true)}}
    $('new').addEventListener('click',()=>{if(dirty&&!confirm('当前修改尚未保存，仍要新建吗？'))return;current={id:'',title:'',content:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};mode='write';setDirty(true);renderEditor();$('title').focus();$('sidebar').classList.remove('open')});
    notes.addEventListener('click',event=>{const button=event.target.closest('[data-id]');if(button)select(button.dataset.id)});$('search').addEventListener('input',event=>{clearTimeout(loadIndex.timer);loadIndex.timer=setTimeout(()=>loadIndex(event.target.value),180)});$('title').addEventListener('input',()=>{if(current){current.title=$('title').value;setDirty(true)}});$('save').addEventListener('click',save);$('writeMode').addEventListener('click',()=>{mode='write';renderEditor()});$('previewMode').addEventListener('click',()=>{if(current&&mode==='write'&&$('content'))current.content=$('content').value;mode='preview';renderEditor()});$('delete').addEventListener('click',async()=>{if(!current?.id||!confirm(`删除“${current.title}”？Markdown 文件也会被删除。`))return;try{await invoke('note_delete',{id:current.id});current=null;setDirty(false);renderEditor();await loadIndex();notify('笔记已删除')}catch(error){notify(error.message||String(error),true)}});$('menu').addEventListener('click',()=>$('sidebar').classList.toggle('open'));window.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='s'){event.preventDefault();save()}});window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});loadIndex();
  </script>
</body>
</html>
