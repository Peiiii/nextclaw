<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收藏</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f0e7;--card:#fffaf2;--ink:#302e2a;--muted:#817d74;--line:#dfd7ca;--accent:#bd6d42;--soft:#f2dfd0;--danger:#a4433e;font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f7e9d7 0,transparent 36%),var(--bg);color:var(--ink)}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.shell{max-width:980px;margin:auto;padding:30px 28px 80px}.header{display:flex;align-items:end;justify-content:space-between;gap:18px}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}h1{font:600 36px/1.1 Georgia,"Songti SC",serif;margin:5px 0}.subtitle{color:var(--muted)}.primary{border:0;border-radius:12px;background:var(--ink);color:var(--card);padding:10px 14px;font-weight:700}.tools{display:flex;gap:10px;margin:24px 0 17px}.search{flex:1;max-width:460px;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:10px 13px;outline:none}.tags{display:flex;gap:6px;overflow:auto;padding-bottom:4px}.tag-filter,.tag{white-space:nowrap;border:0;border-radius:999px;background:var(--soft);padding:5px 9px;color:#78472f}.tag-filter{background:transparent;color:var(--muted)}.tag-filter.active{background:var(--soft);color:#78472f;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.card{display:flex;flex-direction:column;min-width:0;min-height:165px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 95%,transparent);border-radius:17px;padding:16px;box-shadow:0 12px 40px #5537220a;transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:0 17px 45px #55372216}.domain{color:var(--accent);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card h2{font:600 18px/1.35 Georgia,"Songti SC",serif;margin:7px 0 6px;overflow-wrap:anywhere}.note{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.tag{font-size:11px;padding:2px 7px}.card-actions{display:flex;align-items:center;gap:4px;margin-top:auto;padding-top:12px}.open{color:var(--accent);text-decoration:none;font-weight:700;margin-right:auto}.icon,.ghost{border:0;background:transparent;border-radius:9px;padding:6px 8px}.icon:hover,.ghost:hover{background:#0000000a}.empty{text-align:center;color:var(--muted);padding:80px 20px}.empty b{display:block;color:var(--ink);font:600 23px Georgia,"Songti SC",serif;margin-bottom:6px}dialog{border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);padding:0;width:min(520px,calc(100% - 28px));box-shadow:0 30px 100px #0003}dialog::backdrop{background:#281a1266;backdrop-filter:blur(4px)}form{padding:22px}.form-head{display:flex;justify-content:space-between;align-items:center}.form-head h2{font:600 24px Georgia,"Songti SC",serif;margin:0}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field textarea{border:1px solid var(--line);border-radius:11px;background:transparent;padding:10px 11px;outline:none}.field textarea{min-height:85px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:var(--card);padding:10px 13px;border-radius:11px}.error{background:var(--danger)}@media(max-width:580px){.shell{padding:22px 16px 70px}.header{align-items:start}h1{font-size:31px}.tools{display:grid}.search{max-width:none}.grid{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{--bg:#211f1b;--card:#2e2a25;--ink:#f1ece3;--muted:#aaa398;--line:#464038;--soft:#4b372c;--accent:#e19a70}.tag,.tag-filter.active{color:#f1b28e}.icon:hover,.ghost:hover{background:#ffffff0a}}
  </style>
</head>
<body>
  <main class="shell"><header class="header"><div><div class="eyebrow">Personal space</div><h1>收藏</h1><div class="subtitle">只保存值得回来看的东西。</div></div><button class="primary" id="add">＋ 保存链接</button></header><section class="tools"><input class="search" id="search" placeholder="搜索标题、链接或备注…" aria-label="搜索收藏"><div class="tags" id="tags"></div></section><section class="grid" id="grid" aria-live="polite"><div class="empty">正在打开收藏夹…</div></section></main>
  <dialog id="editor"><form method="dialog" id="form"><div class="form-head"><h2 id="formTitle">保存链接</h2><button class="icon" value="cancel" aria-label="关闭">✕</button></div><input type="hidden" id="id"><div class="field"><label for="url">链接</label><input id="url" type="url" required placeholder="https://"></div><div class="field"><label for="title">标题</label><input id="title" required maxlength="180"></div><div class="field"><label for="note">为什么保存</label><textarea id="note" placeholder="一句话就够了。"></textarea></div><div class="field"><label for="tagInput">标签（用逗号分隔）</label><input id="tagInput" placeholder="设计, 稍后读"></div><div class="form-actions"><button class="ghost" value="cancel">取消</button><button class="primary" value="default">保存</button></div></form></dialog><div id="toast" class="toast" role="status" hidden></div>
  <script>
    const service='nextclaw-personal-organizer-data.';let items=[],activeTag='';const $=id=>document.getElementById(id),grid=$('grid'),editor=$('editor'),toast=$('toast');
    async function invoke(action,input={}){if(!window.nextclaw?.serviceActions)throw new Error('NextClaw 服务桥接不可用');return await window.nextclaw.serviceActions.invoke(service+action,input)}
    function esc(value=''){return String(value).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function notify(message,error=false){toast.textContent=message;toast.classList.toggle('error',error);toast.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.hidden=true,2800)}
    function domain(url){try{return new URL(url).hostname.replace(/^www\./,'')}catch{return url}}
    async function load(){try{items=(await invoke('favorite_list',{query:$('search').value,tag:activeTag})).items||[];render()}catch(error){grid.innerHTML='<div class="empty"><b>还不能读取收藏</b><span>请检查个人空间的权限和启用状态。</span></div>';notify(error.message||String(error),true)}}
    function render(){const allTags=[...new Set(items.flatMap(item=>item.tags||[]))].sort();$('tags').innerHTML=`<button class="tag-filter ${!activeTag?'active':''}" data-tag="">全部</button>${allTags.map(tag=>`<button class="tag-filter ${activeTag===tag?'active':''}" data-tag="${esc(tag)}"># ${esc(tag)}</button>`).join('')}`;if(!items.length){grid.innerHTML='<div class="empty"><b>收藏夹还是空的</b><span>保存一个真正想再看的链接。</span></div>';return}grid.innerHTML=items.map(item=>`<article class="card" data-id="${item.id}"><div class="domain">${esc(domain(item.url))}</div><h2>${esc(item.title)}</h2>${item.note?`<div class="note">${esc(item.note)}</div>`:''}<div class="card-tags">${(item.tags||[]).map(tag=>`<span class="tag">${esc(tag)}</span>`).join('')}</div><div class="card-actions"><a class="open" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">打开 ↗</a><button class="icon edit" aria-label="编辑">•••</button><button class="icon remove" aria-label="删除">⌫</button></div></article>`).join('')}
    function openEditor(item){$('formTitle').textContent=item?'编辑收藏':'保存链接';$('id').value=item?.id||'';$('url').value=item?.url||'';$('title').value=item?.title||'';$('note').value=item?.note||'';$('tagInput').value=(item?.tags||[]).join(', ');editor.showModal();setTimeout(()=>$('url').focus(),20)}
    $('add').addEventListener('click',()=>openEditor());$('form').addEventListener('submit',async event=>{if(event.submitter?.value==='cancel')return;event.preventDefault();const id=$('id').value,input={url:$('url').value.trim(),title:$('title').value.trim(),note:$('note').value.trim(),tags:$('tagInput').value.split(/[,，]/).map(v=>v.trim()).filter(Boolean)};try{await invoke(id?'favorite_update':'favorite_save',id?{id,...input}:input);editor.close();await load();notify(id?'收藏已更新':'已保存到收藏')}catch(error){notify(error.message||String(error),true)}});grid.addEventListener('click',async event=>{const card=event.target.closest('.card');if(!card)return;const item=items.find(entry=>entry.id===card.dataset.id);if(event.target.closest('.edit'))openEditor(item);if(event.target.closest('.remove')&&confirm(`删除“${item.title}”？`)){try{await invoke('favorite_delete',{id:item.id});await load();notify('收藏已删除')}catch(error){notify(error.message||String(error),true)}}});$('tags').addEventListener('click',event=>{const button=event.target.closest('[data-tag]');if(button){activeTag=button.dataset.tag;load()}});$('search').addEventListener('input',()=>{clearTimeout(load.timer);load.timer=setTimeout(load,180)});load();
  </script>
</body>
</html>
