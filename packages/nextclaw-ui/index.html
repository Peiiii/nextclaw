<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/pwa-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NextClaw" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="color-scheme" content="light" />
  <style>
    html,
    body,
    #root {
      background: #faf8f4;
    }

    html[data-theme="minimal"],
    html[data-theme="minimal"] body,
    html[data-theme="minimal"] #root {
      background: #ffffff;
    }

    html[data-theme="work"],
    html[data-theme="work"] body,
    html[data-theme="work"] #root {
      background: #ffffff;
    }

    html[data-theme="warm"],
    html[data-theme="warm"] body,
    html[data-theme="warm"] #root {
      background: #faf8f4;
    }

    html[data-theme="cool"],
    html[data-theme="cool"] body,
    html[data-theme="cool"] #root {
      background: #f8fafc;
    }

    html[data-theme="dawn"],
    html[data-theme="dawn"] body,
    html[data-theme="dawn"] #root {
      background: #faf7f4;
    }

    html[data-theme="graphite"],
    html[data-theme="graphite"] body,
    html[data-theme="graphite"] #root {
      background: #f8f8f7;
    }

    html[data-theme="night"],
    html[data-theme="night"] body,
    html[data-theme="night"] #root {
      background: #101318;
    }

    html[data-theme="charcoal"],
    html[data-theme="charcoal"] body,
    html[data-theme="charcoal"] #root {
      background: #1c1c1c;
    }

    html[data-theme="island"],
    html[data-theme="island"] body,
    html[data-theme="island"] #root {
      background: #fbf8ed;
    }

    html[data-theme="probe"],
    html[data-theme="probe"] body,
    html[data-theme="probe"] #root {
      background: #fefcf6;
    }
  </style>
  <script type="module">
    import { initializeTheme, resolveTheme } from '/src/shared/lib/theme/index.ts';
    import { pwaShellThemeManager } from '/src/features/pwa/managers/pwa-shell-theme.manager.ts';

    const theme = initializeTheme();
    pwaShellThemeManager.syncTheme(theme);
    if (resolveTheme(theme) === 'island') {
      const preload = document.createElement('link');
      preload.rel = 'preload';
      preload.as = 'image';
      preload.href = '/themes/island/island-atmosphere-7a037243.webp';
      preload.fetchPriority = 'high';
      document.head.appendChild(preload);
    }
  </script>
  <script>
    (() => {
      if ('%MODE%' === 'development') {
        return;
      }
      const routeMatch = window.location.pathname.match(/^\/chat\/([^/]+)$/);
      const routeValue = routeMatch?.[1];
      if (!routeValue || routeValue === 'draft' || !routeValue.startsWith('sid_')) {
        return;
      }
      const encoded = routeValue.slice(4).replace(/-/g, '+').replace(/_/g, '/');
      const padding = '='.repeat((4 - (encoded.length % 4)) % 4);
      let sessionId;
      try {
        const binary = window.atob(encoded + padding);
        const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
        sessionId = new TextDecoder().decode(bytes);
      } catch {
        return;
      }
      if (!sessionId) {
        return;
      }
      const limit = 20;
      const query = new URLSearchParams({
        limit: String(limit),
        toolPayload: 'summary',
        initialPayload: 'compact'
      });
      const promise = window.fetch(
        `/api/ncp/sessions/${encodeURIComponent(sessionId)}/messages?${query}`,
        {
          credentials: 'same-origin',
          headers: { Accept: 'application/json' },
          priority: 'high'
        }
      ).then(async (response) => ({
        responseOk: response.ok,
        payload: await response.json()
      })).catch(() => null);
      window.__NEXTCLAW_INITIAL_SESSION_MESSAGES_PREFETCH__ = {
        consumed: false,
        limit,
        promise,
        sessionId
      };
    })();
  </script>
  <script>
    (() => {
      const isViteDevServer = '%MODE%' === 'development';
      if (!isViteDevServer || !('serviceWorker' in navigator)) {
        return;
      }

      void navigator.serviceWorker.getRegistrations().then(async (registrations) => {
        const nextclawRegistrations = registrations.filter((registration) => {
          const scriptUrls = [registration.active?.scriptURL, registration.installing?.scriptURL, registration.waiting?.scriptURL]
            .filter(Boolean);
          return scriptUrls.some((scriptUrl) => scriptUrl.endsWith('/sw.js'));
        });

        if (nextclawRegistrations.length === 0) {
          return;
        }

        await Promise.all(nextclawRegistrations.map(async (registration) => await registration.unregister()));
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter((key) => key.startsWith('nextclaw-ui-')).map(async (key) => await caches.delete(key)));
        }
      });
    })();
  </script>
  <script>
    (() => {
      const cleanupKey = 'nextclaw-pwa-legacy-runtime-cache-cleaned-v1';
      const hasCleaned = () => {
        try {
          return window.localStorage.getItem(cleanupKey) === '1';
        } catch {
          return false;
        }
      };
      const markCleaned = () => {
        try {
          window.localStorage.setItem(cleanupKey, '1');
        } catch {
          // ignore storage failures; cache cleanup is still safe to attempt once
        }
      };
      if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller || hasCleaned()) {
        return;
      }

      markCleaned();
      window.stop();
      void Promise.all([
        navigator.serviceWorker.getRegistrations().then((registrations) =>
          Promise.all(registrations.map((registration) => registration.unregister()))
        ),
        'caches' in window
          ? caches.keys().then((keys) =>
              Promise.all(keys.filter((key) => key.startsWith('nextclaw-ui-')).map((key) => caches.delete(key)))
            )
          : Promise.resolve()
      ]).finally(() => {
        window.location.reload();
      });
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
  <title>NextClaw</title>
</head>

<body>
  <div id="root"></div>
  <script vite-ignore src="/api/ui-inject.js"></script>
</body>

</html>
