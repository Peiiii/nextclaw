name = "nextclaw-marketplace-api"
main = "src/main.ts"
compatibility_date = "2026-02-23"
# App metadata reuses runtime platform-target contracts, which require Node compatibility in Workers.
compatibility_flags = ["nodejs_compat"]
workers_dev = false
routes = [
  { pattern = "marketplace-api.nextclaw.io", custom_domain = true },
  { pattern = "apps-registry.nextclaw.io", custom_domain = true }
]

[observability]
enabled = true

# 公开应用目录已通过 D1 Sessions API 接入就近只读副本。生产发布前还需要在
# nextclaw-marketplace-skills 的 Cloudflare D1 设置中启用 Read Replication；
# 这是平台控制面状态，不能仅由 wrangler.toml 声明。

[vars]
MARKETPLACE_CACHE_TTL_SECONDS = "120"
MARKETPLACE_SKILL_AUTO_APPROVE = "true"
NEXTCLAW_PLATFORM_API_BASE = "https://ai-gateway-api.nextclaw.io"

[[d1_databases]]
binding = "MARKETPLACE_SKILLS_DB"
database_name = "nextclaw-marketplace-skills"
database_id = "a39c3efd-4811-40f2-b1c9-f26f18a07c3b"
migrations_dir = "migrations/skills"

[[d1_databases]]
binding = "MARKETPLACE_PLUGINS_DB"
database_name = "nextclaw-marketplace-plugins"
database_id = "17df1af4-5db9-4870-83e9-c151af7bc313"
migrations_dir = "migrations/plugins"

[[r2_buckets]]
binding = "MARKETPLACE_SKILLS_FILES"
bucket_name = "nextclaw-marketplace-skills-files"
