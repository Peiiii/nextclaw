<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>NextClaw 宣传页预览</title>
    <style>
      :root {
        --ink: #173b32;
        --ink-strong: #122c26;
        --muted: #60766d;
        --accent: #168a69;
        --page: #e9ebe4;
        --paper: rgba(255, 253, 244, 0.86);
        --line: rgba(22, 63, 52, 0.14);
        --shadow: 0 24px 80px rgba(25, 56, 46, 0.16);
      }

      * { box-sizing: border-box; }
      html { background: var(--page); }
      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink-strong);
        background:
          radial-gradient(circle at 50% -12rem, rgba(198, 232, 214, 0.9), transparent 39rem),
          linear-gradient(180deg, #eef0e8, #e5e5dd);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button, input, textarea { font: inherit; }
      .shell { width: min(1460px, calc(100% - 48px)); margin: 0 auto; padding: 64px 0 96px; }
      .hero { max-width: 940px; margin: 0 auto 42px; text-align: center; }
      .kicker {
        margin: 0 0 14px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 850;
        letter-spacing: .18em;
        text-transform: uppercase;
      }
      .hero h1 {
        margin: 0;
        font: 700 clamp(38px, 5.6vw, 72px)/1.04 "Kaiti SC", STKaiti, "Songti SC", Georgia, serif;
        letter-spacing: -.055em;
        text-wrap: balance;
      }
      .introduction {
        max-width: 760px;
        margin: 20px auto 0;
        color: var(--muted);
        font-size: clamp(15px, 1.5vw, 18px);
        line-height: 1.75;
      }
      .facts { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
      .fact {
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: rgba(20, 58, 49, .74);
        background: rgba(255, 255, 255, .46);
        font-size: 12px;
        backdrop-filter: blur(10px);
      }

      .section { margin-top: 58px; }
      .section-head { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 17px; }
      .section-head h2 { margin: 0; font: 700 31px/1.1 "Songti SC", Georgia, serif; letter-spacing: -.025em; }
      .section-head p { margin: 0; color: var(--muted); font-size: 13px; }

      .channel-preview {
        width: min(720px, 100%);
        margin: 0 auto;
        padding: 22px;
        border: 1px solid rgba(17, 28, 24, .12);
        border-radius: 23px;
        background: rgba(255, 255, 255, .9);
        box-shadow: 0 20px 64px rgba(25, 50, 42, .12);
      }
      .channel-label { margin-bottom: 16px; color: var(--accent); font-size: 11px; font-weight: 850; letter-spacing: .15em; text-transform: uppercase; }
      .author { display: flex; align-items: center; gap: 11px; }
      .avatar { display: grid; width: 44px; height: 44px; place-items: center; border-radius: 50%; color: white; background: #111a17; font: 800 19px/1 Georgia, serif; }
      .author-name { font-size: 15px; font-weight: 800; }
      .handle { margin-top: 2px; color: #68766f; font-size: 14px; }
      .dots { margin-left: auto; color: #718078; font-size: 22px; }
      .channel-copy { margin: 17px 0; font-size: 17px; line-height: 1.62; }
      .channel-media { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; overflow: hidden; border: 1px solid rgba(19, 46, 38, .12); border-radius: 17px; background: #d6ddd7; }
      .channel-card { position: relative; aspect-ratio: 1; overflow: hidden; background-position: center; background-size: cover; }
      .channel-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(249,247,229,.02), rgba(17,55,45,.2)); }
      .channel-card img { position: absolute; left: 7%; bottom: 7%; width: 86%; height: 58%; padding: 3px; object-fit: contain; object-position: center; border: 1px solid rgba(255,255,255,.7); border-radius: 10px; background: rgba(250,247,232,.76); box-shadow: 0 8px 24px rgba(22,46,38,.18); }
      .channel-card strong { position: absolute; z-index: 2; top: 9%; left: 9%; right: 8%; color: #173f34; font: 750 clamp(11px, 1.2vw, 17px)/1.1 "Kaiti SC", STKaiti, serif; text-wrap: balance; }
      .channel-status { margin-top: 13px; color: #6b7872; font-size: 13px; }

      .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
      .promo-card {
        --card-background: linear-gradient(145deg, #d2eadc, #f0dfaa);
        position: relative;
        isolation: isolate;
        overflow: hidden;
        aspect-ratio: 1;
        border: 1px solid rgba(255,255,255,.45);
        border-radius: 29px;
        color: var(--ink);
        background-image: var(--card-background);
        background-color: #d9dfc1;
        background-position: center;
        background-size: cover;
        box-shadow: var(--shadow);
      }
      .promo-card::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(251,248,228,.03), rgba(244,224,162,.12)); }
      .layout-hero-window { background-position: 43% center; }
      .layout-evidence-board { background-position: 48% center; }
      .layout-editorial { background-position: 27% center; }
      .layout-full-bleed { background-position: 84% center; }
      .card-inner { position: absolute; inset: 0; padding: 6.2%; }
      .card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: rgba(18,57,47,.78); font-size: clamp(10px, .95vw, 14px); font-weight: 850; letter-spacing: .085em; text-transform: uppercase; }
      .brand { display: flex; align-items: center; gap: 8px; }
      .brand-mark { display: grid; width: 24px; height: 24px; place-items: center; border-radius: 7px; color: #f5f3e8; background: #153c33; font: 800 13px/1 Georgia, serif; }
      .card-title { margin: 6.4% 0 0; max-width: 94%; font: 700 clamp(31px, 4.2vw, 62px)/1.03 "Kaiti SC", STKaiti, "Songti SC", Georgia, serif; letter-spacing: -.055em; text-wrap: balance; }
      .card-title .title-line { display: block; white-space: nowrap; }
      .card-body { margin: 2.8% 0 0; max-width: 82%; color: rgba(19,55,46,.72); font: 500 clamp(13px, 1.35vw, 19px)/1.55 "Kaiti SC", STKaiti, "Songti SC", serif; }
      .evidence-group { display: grid; gap: 12px; align-items: end; }
      .evidence-shot { position: relative; min-width: 0; margin: 0; }
      .evidence-shot img { display: block; width: 100%; height: auto; object-fit: contain; object-position: center; border: 1px solid rgba(255,255,255,.78); border-radius: 17px; box-shadow: 0 15px 38px rgba(31,58,48,.2); }
      .layout-hero-window .evidence-group { position: absolute; left: 6.2%; right: 6.2%; bottom: 5%; }
      .evidence-board-copy { position: absolute; left: 6.2%; top: 51%; width: 40%; transform: translateY(-50%); }
      .layout-evidence-board .card-title { max-width: 100%; margin-top: 0; font-size: clamp(27px, 3.5vw, 48px); }
      .layout-evidence-board .card-body { max-width: 100%; }
      .layout-evidence-board .evidence-group { position: absolute; right: 6.2%; top: 51%; width: 42%; transform: translateY(-46%); }
      .layout-evidence-board .evidence-labels { display: grid; grid-template-columns: 1fr; gap: 8px; max-width: 88%; margin-top: 7%; }
      .layout-evidence-board .evidence-labels span { padding: 9px 12px; text-align: left; }
      .layout-editorial .evidence-group { position: absolute; right: 4.5%; bottom: 5%; width: 62%; }
      .evidence-group.composition-sequence { grid-template-columns: repeat(var(--evidence-count), minmax(0, 1fr)); }
      .evidence-group.composition-overview-with-details { grid-template-columns: minmax(0, 2fr) minmax(180px, .72fr); }
      .evidence-group.composition-overview-with-details .evidence-shot:first-child { grid-row: 1 / span 2; }
      .evidence-labels { display: flex; align-items: center; justify-content: space-between; gap: 7px; max-width: 92%; margin-top: 3.2%; }
      .evidence-labels span { flex: 1; padding: 6px 8px; border-radius: 999px; color: #17493d; background: rgba(235,239,219,.82); text-align: center; font-size: clamp(9px, .78vw, 11px); font-weight: 800; white-space: nowrap; }
      .full-bleed-copy { position: absolute; left: 50%; top: 54%; width: 78%; padding: 4.8%; border: 1px solid rgba(255,255,255,.55); border-radius: 20px; background: rgba(250,246,228,.72); text-align: center; transform: translate(-50%, -50%); backdrop-filter: blur(18px); }
      .full-bleed-copy .card-title, .editorial-copy .card-title { margin-top: 0; }
      .editorial-copy { position: relative; z-index: 2; width: 55%; margin-top: 14%; padding: 4%; border: 1px solid rgba(255,255,255,.55); border-radius: 18px; background: rgba(250,246,228,.74); box-shadow: 0 12px 34px rgba(31,58,48,.11); backdrop-filter: blur(16px); }
      .layout-editorial .card-title { font-size: clamp(21px, 3vw, 38px); }
      .layout-full-bleed .card-title { font-size: clamp(28px, 3.7vw, 50px); }
      .layout-full-bleed .card-title, .layout-full-bleed .card-body { max-width: 100%; }
      .concept-flow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 5%; }
      .concept-flow span { padding: 9px 10px; border: 1px solid rgba(21,60,51,.13); border-radius: 999px; color: #17493d; background: rgba(255,255,255,.5); font-size: clamp(10px, .95vw, 13px); font-weight: 750; }
      .editorial-copy .card-body { max-width: 100%; }

      .proof-notes { margin-top: 48px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.42); }
      .proof-notes summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 20px; color: var(--muted); cursor: pointer; font-size: 13px; list-style: none; }
      .proof-notes summary::-webkit-details-marker { display: none; }
      .proof-notes summary::after { content: "+"; color: var(--accent); font-size: 20px; line-height: 1; }
      .proof-notes[open] summary::after { content: "−"; }
      .proof-notes .section { margin: 0; padding: 0 20px 20px; }

      .evidence-panel { display: grid; grid-template-columns: 1.1fr .9fr; gap: 22px; }
      .claim-list, .design-note { padding: 24px; border: 1px solid var(--line); border-radius: 20px; background: rgba(255,255,255,.54); box-shadow: 0 12px 40px rgba(25,53,44,.07); }
      .claim { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
      .claim:last-child { border-bottom: 0; }
      .claim-index { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 9px; color: white; background: var(--accent); font-size: 11px; font-weight: 850; }
      .claim strong { display: block; margin-bottom: 5px; font-size: 15px; }
      .claim span { color: var(--muted); font-size: 13px; line-height: 1.55; }
      .design-note h3 { margin: 0 0 12px; font: 700 22px/1.1 "Songti SC", Georgia, serif; }
      .design-note p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
      .footer { margin-top: 34px; text-align: center; color: #74817b; font-size: 12px; }

      @media (max-width: 840px) {
        .shell { width: min(100% - 24px, 680px); padding-top: 36px; }
        .cards, .evidence-panel { grid-template-columns: 1fr; }
        .section-head { align-items: start; flex-direction: column; gap: 5px; }
        .promo-card { border-radius: 22px; }
        .evidence-group.composition-overview-with-details .evidence-shot:first-child { grid-row: auto; }
      }
    </style>
  </head>
  <body>
    <main class="shell" id="app"></main>
    <script id="promo-page-data" type="application/json">__PROMO_PAGE_DATA__</script>
    <script>
      (() => {
        const payload = JSON.parse(document.querySelector("#promo-page-data").textContent);
        const { brief, embeddedAssets: assets } = payload;
        const app = document.querySelector("#app");
        document.title = `${brief.page.title} · NextClaw 宣传页`;

        const escapeHtml = (value = "") => String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
        const lines = (value = "") => escapeHtml(value).replaceAll("\n", "<br />");
        const semanticTitle = (value = "") => {
          const parts = String(value).split("\n");
          if (parts.length === 1) return escapeHtml(value);
          return parts.map((part) => `<span class="title-line">${escapeHtml(part)}</span>`).join("");
        };
        const asset = (id) => id ? assets[id] : undefined;
        const backgroundStyle = (id) => asset(id) ? `--card-background:url(&quot;${asset(id).src}&quot;)` : "";
        const renderContentPoints = (card) => card.contentPoints?.length
          ? `<div class="concept-flow">${card.contentPoints.map((point) => `<span>${escapeHtml(point)}</span>`).join("")}</div>`
          : "";
        const renderEvidence = (card) => {
          const evidence = card.evidence;
          const items = evidence.assetIds.map(asset);
          return `<div class="evidence-group composition-${escapeHtml(evidence.composition)}" style="--evidence-count:${items.length}">${items.map((item) => `<figure class="evidence-shot"><img src="${item.src}" alt="${escapeHtml(item.alt)}" /></figure>`).join("")}</div>`;
        };
        const cardBody = (card) => {
          if (card.layout === "hero-window") {
            return `<h3 class="card-title">${semanticTitle(card.title)}</h3><p class="card-body">${escapeHtml(card.body || "")}</p>${renderEvidence(card)}`;
          }
          if (card.layout === "evidence-board") {
            const labels = card.detailLabels || ["入口", "工作区", "结果"];
            const labelHtml = card.detailLabels ? `<div class="evidence-labels">${labels.map((label) => `<span>${escapeHtml(label)}</span>`).join("")}</div>` : "";
            return `<div class="evidence-board-copy"><h3 class="card-title">${semanticTitle(card.title)}</h3><p class="card-body">${escapeHtml(card.body || "")}</p>${labelHtml}</div>${renderEvidence(card)}`;
          }
          if (card.layout === "full-bleed") {
            return `<div class="full-bleed-copy"><h3 class="card-title">${semanticTitle(card.title)}</h3><p class="card-body">${escapeHtml(card.body || "")}</p>${renderContentPoints(card)}</div>`;
          }
          return `<div class="editorial-copy"><h3 class="card-title">${semanticTitle(card.title)}</h3><p class="card-body">${escapeHtml(card.body || "")}</p></div>${renderEvidence(card)}`;
        };

        const renderCard = (card) => `<article class="promo-card layout-${escapeHtml(card.layout)}${card.evidence ? " has-evidence" : ""}" style="${backgroundStyle(card.backgroundAssetId || card.evidence?.assetIds?.[0])}">
          <div class="card-inner">
            <div class="card-top"><div class="brand"><span class="brand-mark">Y</span><span>NextClaw</span></div><span>${escapeHtml(card.label || "Campaign")}</span></div>
            ${cardBody(card)}
          </div>
        </article>`;

        const channel = brief.page.channel;
        const channelHtml = channel ? `<section class="section">
          <div class="section-head"><h2>${escapeHtml(channel.label)}</h2><p>渠道只是页面的一部分；先看整套叙事是否成立</p></div>
          <article class="channel-preview">
            <div class="channel-label">Channel copy preview</div>
            <div class="author"><span class="avatar">${escapeHtml(channel.author.slice(0, 1))}</span><div><div class="author-name">${escapeHtml(channel.author)}</div><div class="handle">${escapeHtml(channel.handle)}</div></div><span class="dots">···</span></div>
            <div class="channel-copy">${lines(channel.copy)}</div>
            <div class="channel-media">${brief.cards.slice(0, 2).map((card) => {
              const screenshot = asset(card.evidence?.assetIds?.[0]);
              return `<div class="channel-card" style="background-image:url(&quot;${asset(card.backgroundAssetId || card.evidence?.assetIds?.[0]).src}&quot;)"><strong>${escapeHtml(card.title)}</strong>${screenshot ? `<img src="${screenshot.src}" alt="" />` : ""}</div>`;
            }).join("")}</div>
            <div class="channel-status">${escapeHtml(channel.status || "本地预览")}</div>
          </article>
        </section>` : "";

        const usedAssets = new Map();
        for (const card of brief.cards) {
          for (const assetId of [card.backgroundAssetId, ...(card.evidence?.assetIds || [])].filter(Boolean)) {
            const item = asset(assetId);
            usedAssets.set(assetId, item);
          }
        }

        app.innerHTML = `<header class="hero">
          <p class="kicker">${escapeHtml(brief.page.kicker || "NextClaw campaign page")}</p>
          <h1>${lines(brief.page.title)}</h1>
          <p class="introduction">${escapeHtml(brief.page.introduction)}</p>
          <div class="facts">${(brief.page.facts || ["真实产品证据", "自包含 HTML", `${brief.cards.length} 张传播视觉`]).map((fact) => `<span class="fact">${escapeHtml(fact)}</span>`).join("")}</div>
        </header>
        ${channelHtml}
        <section class="section">
          <div class="section-head"><h2>${escapeHtml(brief.page.visualSectionTitle || "四张图，一个完整故事")}</h2><p>${escapeHtml(brief.page.visualSectionDescription || "每张卡片承担一个明确的信息角色")}</p></div>
          <div class="cards">${brief.cards.map(renderCard).join("")}</div>
        </section>
        <details class="proof-notes">
          <summary><span>创作依据与真实证据</span><span>展开查看</span></summary>
          <section class="section"><div class="evidence-panel">
            <div class="claim-list">${brief.claims.map((claim, index) => {
              const supporters = [...usedAssets.values()].filter((item) => item.supports.includes(claim.id));
              return `<div class="claim"><span class="claim-index">${String(index + 1).padStart(2, "0")}</span><div><strong>${escapeHtml(claim.text)}</strong><span>${supporters.length ? `证据：${supporters.map((item) => escapeHtml(item.alt)).join("；")}` : "概念表达，不冒充产品事实"}</span></div></div>`;
            }).join("")}</div>
            <aside class="design-note"><h3>设计说明</h3><p>${escapeHtml(brief.designNote || "页面以真实内容为锚点，艺术包装只负责建立记忆。")}</p></aside>
          </div></section>
        </details>
        <footer class="footer">Generated locally with NextClaw Promo Page Studio · No external assets or tracking</footer>`;
      })();
    </script>
  </body>
</html>
