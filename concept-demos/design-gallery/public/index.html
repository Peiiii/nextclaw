<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Bibo · 设计目录</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f8f3;color:#30392d;font:14px/1.7 -apple-system,"PingFang SC",sans-serif}main{max-width:1180px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;color:#78856e;font-size:12px;padding-bottom:20px;border-bottom:1px solid #e1e5d9}header b{font:30px Georgia;color:#4e6345}p{color:#7a8570;font-size:13px}a{color:inherit;text-decoration:none}footer{border-top:1px solid #e1e5d9;margin-top:35px;padding-top:18px}footer p{font-size:11px}</style>
<style>main{max-width:1180px;padding:30px 28px}h1{font:550 26px -apple-system,"PingFang SC",sans-serif;margin:28px 0 8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0 15px}input,select,button{font:inherit;color:inherit;padding:9px 12px;border:1px solid #dce2d3;border-radius:6px;background:#fffefa}input{flex:1;min-width:190px}select,button{font-size:12px;cursor:pointer}button:disabled{opacity:.4;cursor:default}.summary{display:flex;justify-content:space-between;font-size:11px;color:#87917c;margin:15px 0 10px}.table-wrap{background:#fffefa;border:1px solid #e0e5d6;border-radius:9px;overflow:hidden}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:11px;color:#8a947d;font-weight:400;background:#f1f4eb;padding:12px 17px}td{padding:16px 17px;border-top:1px solid #e9ece2;font-size:12px}td:first-child{width:44%}.title{display:block;font-size:14px;font-weight:550}.description{display:block;font-size:12px;color:#8a937e;margin-top:4px}.status{font-size:10px;padding:3px 8px;background:#f0f1eb;border-radius:4px;white-space:nowrap}.status.current{background:#e5edda;color:#557341}time{font-size:12px;color:#77846a;font-variant-numeric:tabular-nums;white-space:nowrap}.pager{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:17px;font-size:12px}.empty{text-align:center;padding:35px;color:#87917c}.hidden{display:none}a:hover{color:#66824f}:focus-visible{outline:2px solid #789064;outline-offset:3px}@media(max-width:700px){main{padding:22px 16px}.toolbar input{flex-basis:100%}th:nth-child(2),td:nth-child(2){display:none}td,th{padding:13px 10px}.description{display:none}td:first-child{width:auto}.title{font-size:13px}time{font-size:10px;white-space:normal}.summary{gap:15px}.summary span:last-child{text-align:right}select{max-width:48%}}</style>
<main><header><b>bibo.</b><span>DESIGN DIRECTORY / 设计目录</span></header><h1>设计稿</h1><p>找到当前采用的方案，也能回看每一次探索。</p>
<div class="toolbar"><input id="search" type="search" aria-label="搜索设计稿" placeholder="搜索名称、项目或说明…"><select id="project" aria-label="按项目筛选"><option value="">全部项目</option><option>Personal Agent</option></select><select id="status" aria-label="按状态筛选"><option value="">全部状态</option><option value="current">当前采用</option><option value="archive">对比存档</option><option value="exploration">早期探索</option><option value="original">视觉初稿</option></select><select id="sort" aria-label="排序方式"><option value="recommended">当前采用优先</option><option value="newest">最近更新</option><option value="oldest">最早更新</option><option value="name">名称排序</option></select></div>
<div class="summary"><span id="count" role="status" aria-live="polite"></span><span>更新时间：设计文件最近提交 · 北京时间</span></div><div class="table-wrap"><table><thead><tr><th>设计稿</th><th>项目</th><th>状态</th><th>更新时间</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden">没有匹配的设计稿。<button id="clear">清空筛选</button></div></div><div class="pager"><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></div>
<footer><p>演示部署：<time datetime="2026-09-25T13:44:00+08:00">2026-09-25 13:44</time>（北京时间）。部署时间与设计更新时间分别记录。</p><p>静态概念演示，使用示例数据。未连接真实邮箱、文件系统或 AI 执行。</p></footer></main>
<script>
const designs=[
['studio','Bibo Studio','双列概览 · 对话、任务、笔记与文件工作区','current','13:31:26'],
['workdesk','工作桌构图','三列卡片、跨列项目与搭档侧栏','archive','13:31:26'],
['inbox','通讯优先','探索 A · 从消息与需要回应的事情开始','exploration','09:59:00'],
['day','今日节奏','探索 B · 围绕日程和当天安排组织信息','exploration','09:59:00'],
['brief','Bibo 来信','探索 C · 用个人简报串起值得关注的事','exploration','09:59:00'],
['desk','共同工作桌','探索 D · 把项目、邮件和笔记摆在一起','exploration','09:59:00'],
['original','最初的工作桌','最初的视觉表达，保留设计来源','original','09:59:00']
].map(([slug,name,description,status,time])=>({slug,name,description,status,project:'Personal Agent',updated:'2026-09-25T'+time+'+08:00'}));
const labels={current:'当前采用',archive:'对比存档',exploration:'早期探索',original:'视觉初稿'};
const $=id=>document.getElementById(id);const size=20;let page=1;
function render(){
const q=$('search').value.trim().toLowerCase();
const filtered=designs.filter(d=>(!$('project').value||d.project===$('project').value)&&(!$('status').value||d.status===$('status').value)&&`${d.name} ${d.description} ${d.project}`.toLowerCase().includes(q));
const sort=$('sort').value;
filtered.sort((a,b)=>{if(sort==='name')return a.name.localeCompare(b.name,'zh-CN');if(sort==='recommended'&&(a.status==='current')!==(b.status==='current'))return a.status==='current'?-1:1;return (sort==='oldest'?1:-1)*(Date.parse(a.updated)-Date.parse(b.updated));});
const pages=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,pages);
$('rows').innerHTML=filtered.slice((page-1)*size,page*size).map(d=>`<tr><td><a class="title" href="https://${d.slug}.design.bibo.bot">${d.name} ↗</a><span class="description">${d.description}</span></td><td>${d.project}</td><td><span class="status ${d.status}">${labels[d.status]}</span></td><td><time datetime="${d.updated}">${d.updated.slice(0,10)} ${d.updated.slice(11,16)}</time></td></tr>`).join('');
$('count').textContent=`${filtered.length} 个结果 / 共 ${designs.length} 份设计`;$('empty').classList.toggle('hidden',filtered.length>0);$('page').textContent=`${page} / ${pages}`;$('previous').disabled=page===1;$('next').disabled=page===pages;
}
['search','project','status','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{page=1;render();}));
$('previous').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('clear').onclick=()=>{$('search').value='';$('status').value='';$('project').value='';page=1;render();};render();
</script></html>
