-top:14px}.fact{display:flex;justify-content:space-between;gap:10px;font-size:12px}.fact label{color:var(--muted)}.fact code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px;color:#395b57}.section{grid-column:1/-1}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{color:var(--faint);font-size:10px;text-align:left;font-weight:650}.table th,.table td{padding:10px 7px;border-bottom:1px solid var(--line);vertical-align:top}.table tr:last-child td{border-bottom:0}.status{display:inline-flex;align-items:center;gap:5px;color:var(--teal);font-weight:700}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status.amber{color:var(--amber)}.status.done{color:#56716b}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:13px;border:1px solid var(--line);border-radius:9px;background:var(--soft)}.metric small{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;margin-top:6px;font-size:20px;letter-spacing:-.04em}.metric em{font-style:normal;color:var(--teal);font-size:11px}.bar{height:7px;margin-top:10px;border-radius:5px;background:#e7ecea;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;background:var(--teal)}.run-log{margin-top:13px;padding:12px;border-radius:8px;background:#1e2a2a;color:#c9ddda;font:11px/1.8 ui-monospace,SFMono-Regular,monospace}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:10px}.evidence article{padding:12px;border:1px solid var(--line);border-radius:9px}.evidence article.marked{border-color:#9bcfc5;background:#f1faf7}.evidence h3{font-size:12px}.evidence p{margin:7px 0;color:var(--muted);font-size:11px}.right{display:flex;flex-direction:column;border-left:1px solid var(--line);background:rgba(250,252,251,.7)}.chat-head{padding:20px;border-bottom:1px solid var(--line)}.chat-head b{font-size:14px}.chat-he <body>
<header class="review"><div><b>NextClaw 科研工作台 · 概念原型</b><small>评审用故事阶段，可切换查看同一课题的完整闭环</small></div><div class="review-controls"><nav class="stages" aria-label="评审阶段"><button data-stage="home" aria-selected="true">课题首页</button><button data-stage="design" aria-selected="false">实验设计</button><button data-stage="run" aria-selected="false">运行观察</button><button data-stage="result" aria-selected="false">结果沉淀</button><button data-stage="paper" aria-selected="false">论文衔接</button></nav><button class="action" id="reset">重置演示</button></div></header>
<div class="layout">

</div><div id="toast" class="toast" hidden role="status"></div>
<script>
const state={stage:'home',planned:false,running:false,progress:0,finished:false,evidenced:false,paperUpdated:false};
const stages=['home','design','run','result','paper'];
const messages=document.querySelector('#messages');
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.hidden=false;setTimeout(()=>el.hidden=true,2400)}
function addMsg(who,text,card=''){const el=document.createElement('div');el.className='msg '+(who==='你'?'user':'agent');el.innerHTML='<span class="who">'+who+'</span>'+text+card;messages.append(el);el.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action)));messages.scrollTop=messages.scrollHeight}
function setStage(s){state.stage=s;document.querySelectorAll('[data-stage]').forEach(b=>b.setAttribute('aria-selected',b.dataset.stage===s));render()}
function card(title,body,button,label){return '<div class="inline"><b>'+title+'</b><p>'+body+'</p>'+(button?'<button class="primary" data-action="'+button+'">'+label+'</button>':'')+'</div>'}
function render(){const s=state.stage;let h='';
if(s==='home')h='<div class="eyebrow">研究 · 当前课题</div><div class="heading"><div><h1>智慧物流多智能体集群协同调度</h1><p>用改进算法降低高密度仓储场景的平均调度时间，同时保持任务完成率稳定。</p></div><span class="pill">研究进行中 · 第 12 天</span></div><div class="grid"><section class="card goal"><h2>现在研究什么</h2><p>验证“通信半径自适应”是否能缓解 100 个智能体同时调度时的拥塞，并与基线算法进行可复现实验对照。</p><div class="meta"><span>假设 H2 · 待验证</span><span>当前数据集 · dataset-v3</span><span>最近产物 · run-017</span></div></section><section class="card next"><h2>下一步最值得做什么</h2><p>补齐 100 智能体场景的消融实验，确认收益来自通信半径策略，而不是随机波动。</p><button class="primary" data-action="design">准备实验计划 →</button></section><section class="card"><h2>项目环境</h2><div class="facts"><div class="fact"><label>解释器</label><code>.venv/bin/python</code></div><div class="fact"><label>代码版本</label><code>8c42f1a · adaptive-radius</code></div><div class="fact"><label>数据版本</label><code>dataset-v3</code></div><div class="fact"><label>环境健康</label><span class="status">已检查 · 可运行</span></div></div></section><section class="card"><h2>研究进度</h2><div class="facts"><div class="fact"><label>研究计划</label><strong>3 / 5 项完成</strong></div><div class="fact"><label>当前运行</label><strong>'+ (state.running?'run-018 · 运行中':'等待下一轮实验')+'</strong></div><div class="fact"><label>待我决定</label><strong>批准实验计划</strong></div></div></section></div>';
if(s==='design')h='<div class="eyebrow">实验 · 计划确认</div><div class="heading"><div><h1>下一轮实验计划</h1><p>确认研究意图与资源成本后，NextClaw 将创建可追溯的 run-018。</p></div><span class="pill">待批准</span></div><div class="grid"><section class="card"><h2>研究假设</h2><p>在 100 个智能体的高密度场景中，自适应通信半径能把平均调度时间从 4.8s 降到 4.2s 以内，且任务完成率不低于 96%。</p><div class="metric-row"><div class="metric"><small>对照组</small><strong>基线算法</strong><em>固定通信半径</em></div><div class="metric"><small>实验组</small><strong>改进算法</strong><em>自适应半径</em></div><div class="metric"><small>重复次数</small><strong>5 × 2</strong><em>相同随机种子</em></div></div></section><section class="card"><h2>执行约束</h2><div class="facts"><div class="fact"><label>解释器</label><code>.venv/bin/python</code></div><div class="fact"><label>数据集</label><code>dataset-v3</code></div><div class="fact"><label>预计耗时</label><strong>约 8 分钟</strong></div><div class="fact"><label>停止条件</label><strong>完成 10 个 runs</strong></div></div><div class="actions"><button class="primary" data-action="approve">批准并开始模拟运行</button><button class="secondary" data-action="home">返回课题首页</button></div></section><section class="card section"><div class="section-head"><h2>变量与输出</h2><span class="pill">已锁定</span></div><div class="table-wrap"><table class="table"><thead><tr><th>项目</th><th>固定条件</th><th>观察指标</th><th>输出位置</th></tr></thead><tbody><tr><td>场景规模</td><td>100 个智能体</td><td>平均调度时间、完成率</td><td><code>artifacts/run-018/</code></td></tr><tr><td>算法</td><td>基线 vs 改进</td><td>拥塞次数、P95 延迟</td><td><code>metrics.json</code></td></tr></tbody></table></div></section></div>';
if(s==='run')h='<div class="eyebrow">运行 · run-018</div><div class="heading"><div><h1>运行观察</h1><p>执行过程、环境和参数都固定记录在本次 run 中；刷新或重新进入不会丢失状态。</p></div><span class="pill">'+(state.finished?'已完成':'运行中')+'</span></div><div class="grid"><section class="card"><div class="section-head"><h2>模拟实验进度</h2><strong>'+state.progress+' / 10 runs</strong></div><div class="bar"><i style="width:'+(state.progress*10)+'%"></i></div><div class="facts"><div class="fact"><label>当前阶段</label><strong>'+ (state.finished?'产物已生成':'基线与改进算法对照')+'</strong></div><div class="fact"><label>预计剩余</label><strong>'+ (state.finished?'0 分钟':Math.max(1,8-Math.round(state.progress*.8))+' 分钟')+'</strong></div><div class="fact"><label>资源</label><strong>本地 CPU · 4 workers</strong></div></div><div class="actions">'+(state.finished?'<button class="primary" data-action="result">查看结果比较 →</button>':'<button class="secondary" data-action="finish">推进完成（模拟）</button>')+'</div></section><section class="card"><h2>本次运行的固定上下文</h2><div class="facts"><div class="fact"><label>解释器</label><code>.venv/bin/python</code></div><div class="fact"><label>代码版本</label><code>8c42f1a</code></div><div class="fact"><label>数据版本</label><code>dataset-v3</code></div><div class="fact"><label>参数</label><code>agents=100 · seed=42</code></div></div></section><section class="card section"><div class="section-head"><h2>日志摘要</h2><span class="status">状态文字 · 可恢复</span></div><div class="run-log">[09:42:11] environment .venv/bin/python OK<br>[09:42:18] dataset-v3 loaded · 100 agents<br>[09:43:02] baseline batch '+Math.max(3,state.progress-1)+'/5 complete<br>[09:43:26] adaptive-radius batch '+Math.max(2,state.progress-2)+'/5 complete<br>[09:43:31] '+(state.finished?'artifacts written · metrics.json':'waiting for next batch…')+'</div></section></div>';
if(s==='result')h='<div class="eyebrow">结果 · 证据沉淀</div><div class="heading"><div><h1>结果比较与结论</h1><p>从同一批 run-018 产物生成的比较；选择一条结论加入证据库，供论文段落引用。</p></div><span class="pill">'+(state.evidenced?'已加入证据库':'待选择证据')+'</span></div><div class="grid"><section class="card"><h2>关键指标</h2><div class="metric-row"><div class="metric"><small>平均调度时间</small><strong>4.18s</strong><em>↓ 12.9% vs 基线</em></div><div class="metric"><small>任务完成率</small><strong>97.2%</strong><em>↑ 1.1pp</em></div><div class="metric"><small>P95 延迟</small><strong>6.03s</strong><em>↓ 8.4%</em></div></div><div class="actions"><button class="primary" data-action="evidence">'+(state.evidenced?'已加入证据库':'将改进算法结果加入证据')+'</button><button class="secondary" data-action="paper">查看论文衔接 →</button></div></section><section class="card"><h2>分析判断</h2><p>结果支持 H2：自适应通信半径在 100 智能体场景下改善了调度效率，且任务完成率没有下降。</p><div class="meta"><span>判断 · 支持假设</span><span>来源 · run-018</span></div></section><section class="card section"><div class="section-head"><h2>可追溯产物</h2><span class="status done">3 个产物已保存</span></div><div class="evidence"><article class="marked"><h3>metrics.json</h3><p>基线与改进算法的 10 组指标汇总</p><code>artifacts/run-018/metrics.json</code></article><article><h3>comparison.png</h3><p>调度时间与完成率对照图</p><code>artifacts/run-018/comparison.png</code></article></div></section></div>';
