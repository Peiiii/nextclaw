[package]
name = "nextclaw-wasmtime-runner"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = [
  "guests/state-lab",
  "guests/capability-lab",
  "guests/resident-lab",
  "guests/provider-lab",
  "guests/composition-lab",
]

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spin-app = { git = "https://github.com/spinframework/spin", tag = "v4.0.2" }
spin-core = { git = "https://github.com/spinframework/spin", tag = "v4.0.2" }
spin-factor-wasi = { git = "https://github.com/spinframework/spin", tag = "v4.0.2" }
spin-factors = { git = "https://github.com/spinframework/spin", tag = "v4.0.2" }
spin-factors-executor = { git = "https://github.com/spinframework/spin", tag = "v4.0.2" }
tokio = { version = "1", features = ["macros", "rt", "io-std", "io-util"] }
url = "2.5"
wasmtime = { version = "44.0", features = ["component-model-async"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Spin telemetry still pulls native-tls on Linux. Vendoring OpenSSL keeps the
# musl release cross-build self-contained instead of depending on a host sysroot.
openssl = { version = "0.10", features = ["vendored"] }
