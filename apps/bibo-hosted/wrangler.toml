name = "bibo-hosted"
account_id = "adb27b39051202962038992eeaf8f6bb"
main = "src/app/bibo-hosted.app.ts"
compatibility_date = "2026-09-24"
compatibility_flags = ["nodejs_compat", "durable_object_io_tasks_prevent_eviction"]
workers_dev = true
routes = [{ pattern = "app.bibo.bot", custom_domain = true }, { pattern = "bibo.bot/app/*", zone_name = "bibo.bot" }]

[assets]
directory = "./dist/public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "bibo-user-snapshots"

[[durable_objects.bindings]]
name = "BIBO_USER"
class_name = "BiboUserContainer"

[[durable_objects.bindings]]
name = "BIBO_MODEL_BUDGET"
class_name = "BiboModelBudget"

[[durable_objects.bindings]]
name = "BIBO_SANDBOX"
class_name = "Sandbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BiboUserContainer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BiboModelBudget"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Sandbox"]

[[containers]]
class_name = "Sandbox"
image = "docker.io/cloudflare/sandbox:0.12.10"
max_instances = 20
instance_type = "basic"

[observability]
enabled = true
head_sampling_rate = 1
