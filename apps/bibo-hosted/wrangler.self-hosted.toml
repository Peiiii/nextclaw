# Change the Worker and bucket names before deploying to your own account.
name = "bibo-personal"
main = "src/app/bibo-hosted.app.ts"
compatibility_date = "2026-09-24"
compatibility_flags = ["nodejs_compat", "durable_object_io_tasks_prevent_eviction"]
workers_dev = true

[vars]
BIBO_AUTH_MODE = "self-hosted"
BIBO_OWNER_EMAIL = "owner@example.com"

[assets]
directory = "./dist/public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "bibo-personal-data"

[[durable_objects.bindings]]
name = "BIBO_USER"
class_name = "BiboUserContainer"

[[durable_objects.bindings]]
name = "BIBO_MODEL_BUDGET"
class_name = "BiboModelBudget"

[[durable_objects.bindings]]
name = "BIBO_SANDBOX"
class_name = "Sandbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BiboUserContainer", "BiboModelBudget", "Sandbox"]

[[containers]]
class_name = "Sandbox"
image = "docker.io/cloudflare/sandbox:0.12.10"
max_instances = 2
instance_type = "basic"

[observability]
enabled = true
head_sampling_rate = 1
