name: npm-release-prepare

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-prepare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: prepare exact-commit NPM artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bind checkout to master
        run: |
          git switch -C master "$GITHUB_SHA"
          git branch --set-upstream-to=origin/master master

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Detect a releasable NPM batch
        id: release-batch
        shell: bash
        run: |
          if pnpm release:auto:changeset --check; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No releasable public package drift exists at $GITHUB_SHA."
          fi

      - name: Prepare immutable release tree and tarballs
        if: steps.release-batch.outputs.ready == 'true'
        run: >-
          pnpm release:npm:prepare --
          --branch master
          --target-branch master
          --artifact-output "${{ runner.temp }}/npm-release-prepared"

      - name: Upload exact-commit prepared artifact
        if: steps.release-batch.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-prepared-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/npm-release-prepared
