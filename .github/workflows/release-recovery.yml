name: Release Recovery
on:
  workflow_run:
    workflows: [release, Docs Deploy, npm-release-prepare]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Resume a verified transient failure from an existing run"
        required: true
        type: string
permissions: {}
concurrency:
  group: release-recovery-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false
jobs:
  recover-transient:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Automatic recovery owns only transient infrastructure failures.
            const repo = context.repo;
            const event = context.payload.workflow_run ?? (await github.rest.actions.getWorkflowRun(
              {...repo, run_id: Number(context.payload.inputs.run_id)})).data;
            if (event.head_repository?.full_name !== `${repo.owner}/${repo.repo}` ||
                event.head_branch !== 'master' ||
                !['workflow_dispatch', 'push'].includes(event.event)) return;
            const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id: event.id});
            const workflow = run.path;
            if (!['.github/workflows/release.yml', '.github/workflows/docs-deploy.yml', '.github/workflows/npm-release-prepare.yml'].includes(workflow)) return;
            if (run.status !== 'completed' || run.conclusion !== 'failure' ||
                run.run_attempt !== event.run_attempt || run.run_attempt >= 4) {
              core.notice('No recovery: stale event, active run, or retry limit.');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt,
              {...repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100});
            let transient = 0;
            for (const job of jobs) {
              if (!['failure', 'cancelled', 'timed_out', 'action_required'].includes(job.conclusion) ||
                  job.name === 'summarize release state') continue;
              const check_run_id = Number(job.check_run_url?.split('/').pop());
              const annotations = check_run_id ? await github.paginate(
                github.rest.checks.listAnnotations, {...repo, check_run_id, per_page: 100}) : [];
              let retryable = !job.runner_name && annotations.some(a =>
                a.message.includes('The job was not acquired by Runner of type hosted'));
              if (!retryable && workflow === '.github/workflows/docs-deploy.yml' && job.name === 'verify') {
                const {data: log} = await github.rest.actions.downloadJobLogsForWorkflowRun(
                  {...repo, job_id: job.id});
                retryable = typeof log === 'string' && log.includes('ConnectTimeoutError');
              }
              if (!retryable && workflow === '.github/workflows/npm-release-prepare.yml') {
                const {data: log} = await github.rest.actions.downloadJobLogsForWorkflowRun({...repo, job_id: job.id});
                const missing = typeof log === 'string' && log.includes('ERR_PNPM_NO_MATCHING_VERSION')
                  ? log.match(/No matching version found for ((?:@[a-z0-9._-]+\/)?[a-z0-9._-]+)@(\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?)/) : null;
                if (missing) {
                  const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(missing[1])}/${encodeURIComponent(missing[2])}`,
                    {signal: AbortSignal.timeout(15000)});
                  const resolved = response.ok ? await response.json() : null;
                  retryable = resolved?.name === missing[1] && resolved?.version === missing[2];
                }
              }
              if (!retryable) {
                core.notice(`No automatic recovery for unclassified failure: ${job.name}`);
                return;
              }
              transient++;
            }
            if (!transient) return;
            await github.rest.actions.reRunWorkflowFailedJobs({...repo, run_id: run.id});
            core.notice(`Resumed run ${run.id}, attempt ${run.run_attempt + 1}; successful checkpoints retained.`);
