name: portable-runtime-validate

on:
  pull_request:
    paths:
      - "apps/nextclaw-wasmtime-runner/**"
      - "packages/nextclaw/resources/apps/nextclaw-portable-runtime-lab/**"
      - "packages/nextclaw-app-runtime/src/services/app-rust-wasi-scaffold-template.service.ts"
      - "packages/nextclaw/src/cli/app/**"
      - "packages/nextclaw/src/cli/shared/lib/distribution/**"
      - "packages/nextclaw/scripts/verify-portable-runtime-http-smoke.mjs"
      - "packages/nextclaw-service/src/launcher/**"
      - "packages/nextclaw-service/src/managers/runtime-update.manager*"
      - "packages/nextclaw-service/src/services/runtime/npm-runtime-*"
      - ".github/workflows/portable-runtime-validate.yml"
      - "package.json"
  push:
    branches:
      - master
      - main
    paths:
      - "apps/nextclaw-wasmtime-runner/**"
      - "packages/nextclaw/resources/apps/nextclaw-portable-runtime-lab/**"
      - "packages/nextclaw-app-runtime/src/services/app-rust-wasi-scaffold-template.service.ts"
      - "packages/nextclaw/src/cli/app/**"
      - "packages/nextclaw/src/cli/shared/lib/distribution/**"
      - "packages/nextclaw/scripts/verify-portable-runtime-http-smoke.mjs"
      - "packages/nextclaw-service/src/launcher/**"
      - "packages/nextclaw-service/src/managers/runtime-update.manager*"
      - "packages/nextclaw-service/src/services/runtime/npm-runtime-*"
      - ".github/workflows/portable-runtime-validate.yml"
      - "package.json"
  workflow_dispatch:
    inputs:
      target:
        description: Native target to validate during focused recovery
        type: choice
        default: all
        options:
          - all
          - darwin-arm64
          - linux-x64
          - win32-x64

permissions:
  contents: read

concurrency:
  group: portable-runtime-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        name: Select native targets
        shell: bash
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          case "$TARGET" in
            darwin-arm64) matrix='[{"os":"macos-14","platform":"darwin","arch":"arm64","target":"darwin-arm64","cargo_target":"aarch64-apple-darwin"}]' ;;
            linux-x64) matrix='[{"os":"ubuntu-22.04","platform":"linux","arch":"x64","target":"linux-x64","cargo_target":"x86_64-unknown-linux-musl"}]' ;;
            win32-x64) matrix='[{"os":"windows-latest","platform":"win32","arch":"x64","target":"win32-x64","cargo_target":"x86_64-pc-windows-msvc"}]' ;;
            all) matrix='[{"os":"macos-14","platform":"darwin","arch":"arm64","target":"darwin-arm64","cargo_target":"aarch64-apple-darwin"},{"os":"ubuntu-22.04","platform":"linux","arch":"x64","target":"linux-x64","cargo_target":"x86_64-unknown-linux-musl"},{"os":"windows-latest","platform":"win32","arch":"x64","target":"win32-x64","cargo_target":"x86_64-pc-windows-msvc"}]' ;;
            *) echo "Unsupported target: $TARGET" >&2; exit 2 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  native-runner:
    needs: select-matrix
    name: native-runner-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: wasm32-wasip2,${{ matrix.cargo_target }}

      - name: Install cargo-component
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-component

      - name: Install Linux static toolchain
        if: ${{ matrix.platform == 'linux' }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Validate build contract
        run: node --test apps/nextclaw-wasmtime-runner/scripts/build-product-runtime.test.mjs

      - name: Build native runner and universal Components
        run: node apps/nextclaw-wasmtime-runner/scripts/build-product-runtime.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Verify native runner Factor and lifecycle contract
        run: node apps/nextclaw-wasmtime-runner/tools/spin-runner-smoke.tools.mjs

      - name: Run native runner tests
        working-directory: apps/nextclaw-wasmtime-runner
        run: cargo test --release

      - name: Verify Linux runner is statically linked
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          runner="packages/nextclaw/resources/native/linux-x64/nextclaw-wasmtime-runner"
          ! readelf -l "$runner" | grep -q 'Requesting program interpreter'
          ! readelf -d "$runner" | grep -q '(NEEDED)'

      - name: Build NextClaw runtime closure
        run: pnpm --filter nextclaw... build

      - name: Verify real HTTP enable and component lifecycle
        run: pnpm -C packages/nextclaw validation:portable-runtime-http -- --verify-rust-wasi-scaffold

      - name: Upload runner resource
        uses: actions/upload-artifact@v4
        with:
          name: portable-runtime-${{ matrix.target }}
          path: packages/nextclaw/resources/native/${{ matrix.target }}/nextclaw-wasmtime-runner*
          if-no-files-found: error
