name: Bug Report
description: Report a reproducible problem before submitting a fix.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please provide enough evidence for maintainers to reproduce the problem.

        A bug report is not automatically open for outside implementation. If you want to submit a fix, wait until the Issue receives `help wanted` and a maintainer explicitly confirms your scope or assigns the Issue to you.
  - type: textarea
    id: bug_summary
    attributes:
      label: Bug summary
      description: What is wrong right now?
      placeholder: A concise description of the observable problem.
    validations:
      required: true
  - type: textarea
    id: repro_steps
    attributes:
      label: Reproduction steps
      description: List exact steps so maintainers can reproduce quickly.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected_result
    attributes:
      label: Expected result
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual_result
    attributes:
      label: Actual result
      description: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area is affected most?
      options:
        - CLI
        - Web UI
        - Desktop
        - Agent runtime
        - Channel / messaging
        - App / Marketplace
        - Installation / update
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: NextClaw version or commit SHA.
      placeholder: "nextclaw --version or commit SHA"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, installation method, runtime, and other relevant details.
      placeholder: |
        OS:
        Node:
        Installation:
        Runtime:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste only relevant excerpts. Remove credentials, tokens, private content, and personal data.
      render: shell
    validations:
      required: false
  - type: dropdown
    id: contribution_interest
    attributes:
      label: Would you like to submit a fix if this is opened for contribution?
      options:
        - "No — report only"
        - "Yes — I can help after scope confirmation"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing Issues and did not find a duplicate.
          required: true
        - label: I can reproduce this on the latest main branch or latest release.
          required: true
        - label: I removed credentials, tokens, private logs, and personal data.
          required: true
        - label: If I submit a fix, I will wait for `help wanted` plus explicit maintainer confirmation or assignment before opening a PR.
          required: true
